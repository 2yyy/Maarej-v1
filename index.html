<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة عضوية الطالب</title>

    <style>
        :root {
            --primary-brown: #f1f1f1;
            --dark-brown: #030303;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;

            /* 🔹 خلفية الموقع صورة */
            background-image: url("background.jpg"); /* غيّرها */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .card {
            background: rgb(112, 113, 141);
            width: 100%;
            max-width: 380px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            overflow: hidden;
            border: 2px solid #000000;
        }

        .header {
            background: var(--primary-brown);
            color: rgb(112, 113, 141);
            text-align: center;
            padding: 30px 20px 25px;
        }

        /* 🔹 الشعار بدون دائرة */
        .logo {
            display: block;
            margin: 0 auto 10px;
            max-width: 180px;
            max-height: auto;
            object-fit: contain;
        }

        .header p {
            margin: 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .header h2 {
            margin: 5px 0 0;
            font-size: 22px;
        }

        .content {
            padding: 25px;
        }

        .info-box {
            background: #f1f1f1;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border-right: 5px solid var(--primary-brown);
        }

        .label {
            font-size: 12px;
            color: #70718d;
            font-weight: bold;
        }

        .value {
            font-size: 18px;
            color: var(--dark-brown);
            display: block;
            margin-top: 5px;
            font-weight: 600;
        }

        .discounts {
            background: #f1f1f1;
            border: 1px dashed #000000;
            border-radius: 15px;
            padding: 15px;
        }

        .discounts h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #000000;
            text-align: center;
        }

        .discounts ul {
            margin: 0;
            padding-right: 20px;
            font-size: 14px;
            color: #000000;
            line-height: 1.8;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 11px;
            color: #030303;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        <!-- 🔹 الشعار -->
        <img src="logo.png" alt="الشعار" class="logo">

        <h2>بطاقة عضوية</h2>
    </div>

    <div class="content">
        <div class="info-box">
            <span class="label">اسم العضو</span>
            <span class="value" id="student-name">جاري التحميل...</span>
        </div>

        <div class="info-box">
            <span class="label">رقم العضوية</span>
            <span class="value" id="student-id">#000000</span>
        </div>

        <div class="discounts">
            <h3>المحلات والخصومات المتاحة</h3>
            <ul>
                <li><strong>فلق للقهوة المختصة:</strong> خصم 20%</li>
                <li><strong>سفن سويت:</strong> خصم 15%</li>
                <li><strong>مستر فريش:</strong> خصم 20%</li>
                <li><strong>مورجيان:</strong> خصم 10%</li>
                <li><strong>استكانة الأولين:</strong> خصم 10%</li>
            </ul>
        </div>
    </div>

    <div class="footer">
        يجب إبراز الهوية الشخصية عند الطلب
    </div>

</div>

<script>
    const params = new URLSearchParams(window.location.search);

    document.getElementById('student-name').innerText =
        params.get('name') || "طالب غير مسجل";

    document.getElementById('student-id').innerText =
        "#" + (params.get('id') || "000000");

    if (params.get('prog')) {
        document.getElementById('prog-name').innerText = params.get('prog');
    }
</script>

<script>
const shops = [
  {
    name: "فلق للقهوة المختصة",
    lat: 31.3373089,
    lng: 37.3293707,
    radius: 80
  },
  {
    name: "سفن سويت",
    lat: 31.315343,
    lng: 37.345827,
    radius: 80
  },
  {
    name: "مستر فريش",
    lat: 31.33780173839487,
    lng: 37.335150528134996,
    radius: 80
  }
];
</script>

<script>
function distance(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(Δφ / 2) ** 2 +
    Math.cos(φ1) * Math.cos(φ2) *
    Math.sin(Δλ / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
</script>

<script>
window.onload = () => {
  navigator.geolocation.getCurrentPosition(
    pos => detectShop(pos.coords.latitude, pos.coords.longitude),
    () => console.log("لم يتم السماح بالموقع")
  );
};

function detectShop(lat, lng) {
  for (const shop of shops) {
    const d = distance(lat, lng, shop.lat, shop.lng);
    if (d <= shop.radius) {
      registerVisit(shop.name);
      break;
    }
  }
}
</script>

<script>
function registerVisit(shopName) {
  const params = new URLSearchParams(window.location.search);

  fetch("https://script.google.com/macros/s/AKfycby3tLs86mvAqSF6AfTJmEeizmk2FaW3mLexjebxyvxuT9o5BreKJOFGMsyLAGuXg4dT/exec", {
    method: "POST",
    body: JSON.stringify({
      name: params.get("name"),
      id: params.get("id"),
      shop: shopName
    })
  });
}
</script>


</body>

</html>
